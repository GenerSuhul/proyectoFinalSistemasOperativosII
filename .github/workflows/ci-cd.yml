name: Airport Platform CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Kubernetes. Use true only after VPS cluster and KUBE_CONFIG_B64 are configured."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/airport-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/airport-frontend

jobs:
  build-test:
    name: Build Backend and Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -pl backend -am package -DskipTests

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Docker metadata frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.ref == 'refs/heads/main'
    environment: production
    env:
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "::error::Missing GitHub secret KUBE_CONFIG_B64. Generate it on the VPS with: base64 -w0 ~/.kube/config"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_B64}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context
          kubectl config view --minify

      - name: Patch image registry
        run: |
          sed -i "s|ghcr.io/YOUR_ORG/airport-backend:1.0.0|${BACKEND_IMAGE}:latest|g" k8s/backend-deployment.yaml
          sed -i "s|ghcr.io/YOUR_ORG/airport-frontend:1.0.0|${FRONTEND_IMAGE}:latest|g" k8s/frontend-deployment.yaml

      - name: Validate Kubernetes access
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Apply Kubernetes manifests
        run: kubectl apply --validate=false -f k8s/

      - name: Wait rollout
        run: |
          kubectl -n airport rollout status deployment/oracle --timeout=15m
          kubectl -n airport rollout status deployment/backend --timeout=5m
          kubectl -n airport rollout status deployment/frontend --timeout=5m
          kubectl -n airport rollout status deployment/prometheus --timeout=5m
          kubectl -n airport rollout status deployment/grafana --timeout=5m
