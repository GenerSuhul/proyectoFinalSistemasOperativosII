groups:
  - name: airport-application
    rules:
      - alert: AirportBackendDown
        expr: up{job="airport-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend Airport no responde"
          description: "Prometheus no puede scrapear /actuator/prometheus."

      - alert: AirportHighHttp500
        expr: increase(http_server_requests_seconds_count{status=~"5.."}[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Errores HTTP 500 elevados"
          description: "El backend generó más de 5 errores 5xx en 5 minutos."
