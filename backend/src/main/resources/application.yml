server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: airport-backend
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:AIRPORT}
    password: ${DB_PASSWORD:AirportPass123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  payments:
    approval-rate: ${PAYMENT_APPROVAL_RATE:0.88}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: airport-backend

springdoc:
  swagger-ui:
    path: /swagger-ui.html
