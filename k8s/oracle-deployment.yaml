apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: airport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23.7-slim-faststart
          ports:
            - containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airport-secrets
                  key: ORACLE_PASSWORD
            - name: APP_USER
              value: AIRPORT
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airport-secrets
                  key: DB_PASSWORD
            - name: INIT_SGA_SIZE
              value: "1024"
            - name: INIT_PGA_SIZE
              value: "512"
          volumeMounts:
            - name: oracle-data
              mountPath: /opt/oracle/oradata
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 90
            periodSeconds: 20
          livenessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 5Gi
      volumes:
        - name: oracle-data
          persistentVolumeClaim:
            claimName: oracle-data
