apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-nginx-conf
  namespace: airport
data:
  default.conf: |
    server {
      listen 8080;
      server_name umg.kyrosoftgs.com;

      location /api/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend_upstream backend.airport.svc.cluster.local;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /swagger-ui/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend_upstream backend.airport.svc.cluster.local;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /v3/api-docs/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend_upstream backend.airport.svc.cluster.local;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $frontend_upstream frontend.airport.svc.cluster.local;
        proxy_pass http://$frontend_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-proxy
  namespace: airport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-proxy
  template:
    metadata:
      labels:
        app: edge-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: umg-master.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: edge-proxy
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              hostPort: 80
          volumeMounts:
            - name: edge-nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: edge-nginx-conf
          configMap:
            name: edge-nginx-conf
