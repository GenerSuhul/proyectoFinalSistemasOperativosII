apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-caddy-config
  namespace: airport
data:
  Caddyfile: |
    {
      email admin@kyrosoftgs.com
    }

    umg.kyrosoftgs.com {
      encode gzip zstd

      handle /api/* {
        reverse_proxy backend.airport.svc.cluster.local:8080
      }

      handle /swagger-ui/* {
        reverse_proxy backend.airport.svc.cluster.local:8080
      }

      handle /v3/api-docs* {
        reverse_proxy backend.airport.svc.cluster.local:8080
      }

      handle {
        reverse_proxy frontend.airport.svc.cluster.local:80
      }
    }

    grafana.umg.kyrosoftgs.com {
      encode gzip zstd
      reverse_proxy grafana.airport.svc.cluster.local:3000
    }

    prometheus.umg.kyrosoftgs.com {
      encode gzip zstd
      reverse_proxy prometheus.airport.svc.cluster.local:9090
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: airport
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-proxy
  namespace: airport
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edge-proxy
  template:
    metadata:
      labels:
        app: edge-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: umg-worker.local
      containers:
        - name: edge-proxy
          image: caddy:2.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: caddy-config
          configMap:
            name: edge-caddy-config
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
