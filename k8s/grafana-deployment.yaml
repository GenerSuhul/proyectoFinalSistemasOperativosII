apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: airport
data:
  application-dashboard.json: |
    {"uid":"airport-app","title":"Airport Application Dashboard","schemaVersion":39,"version":1,"refresh":"10s","panels":[{"type":"stat","title":"Backend Up","gridPos":{"x":0,"y":0,"w":6,"h":4},"targets":[{"expr":"up{job=\"airport-backend\"}","refId":"A"}]},{"type":"timeseries","title":"HTTP Requests","gridPos":{"x":6,"y":0,"w":9,"h":6},"targets":[{"expr":"sum(rate(http_server_requests_seconds_count[1m])) by (uri, method, status)","refId":"A"}]},{"type":"timeseries","title":"JVM Memory","gridPos":{"x":15,"y":0,"w":9,"h":6},"targets":[{"expr":"sum(jvm_memory_used_bytes{job=\"airport-backend\"}) by (area)","refId":"A"}]}]}
  cluster-dashboard.json: |
    {"uid":"airport-cluster","title":"Airport Kubernetes Cluster Dashboard","schemaVersion":39,"version":1,"refresh":"15s","panels":[{"type":"stat","title":"Pods Running","gridPos":{"x":0,"y":0,"w":6,"h":4},"targets":[{"expr":"sum(kube_pod_status_phase{namespace=\"airport\", phase=\"Running\"})","refId":"A"}]},{"type":"timeseries","title":"CPU by Pod","gridPos":{"x":6,"y":0,"w":9,"h":6},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"airport\", container!=\"\"}[5m])) by (pod)","refId":"A"}]},{"type":"timeseries","title":"Memory by Pod","gridPos":{"x":15,"y":0,"w":9,"h":6},"targets":[{"expr":"sum(container_memory_working_set_bytes{namespace=\"airport\", container!=\"\"}) by (pod)","refId":"A"}]}]}
  node-dashboard.json: |
    {"uid":"airport-node","title":"Airport Node Dashboard","schemaVersion":39,"version":1,"refresh":"15s","panels":[{"type":"timeseries","title":"Node CPU","gridPos":{"x":0,"y":0,"w":12,"h":6},"targets":[{"expr":"100 - (avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)","refId":"A"}]},{"type":"timeseries","title":"Node Memory","gridPos":{"x":12,"y":0,"w":12,"h":6},"targets":[{"expr":"(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100","refId":"A"}]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: airport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airport-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: airport
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
